<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life of Pi — Peer Group Learning Experience</title>
<style>
:root {
  --teal:#0f6f78; --deep:#123f49; --aqua:#dff4f5; --gold:#e3b34b;
  --light:#f7fbfc; --gray:#5c6870; --green:#24734b; --red:#a43b3b;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eaf8fa,#fff);color:#17333b}
.container{max-width:980px;margin:auto;padding:24px}
.hero{background:white;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #0b465018}
.hero img{width:100%;height:300px;object-fit:contain;display:block;background:#eef8f9}
.heroText{padding:28px;text-align:center}
h1{font-size:38px;margin:5px 0;color:var(--deep)}
h2{color:var(--teal);margin-top:0}
.subtitle{font-size:19px;color:var(--gray)}
.progress{display:flex;gap:7px;overflow:auto;margin:20px 0;padding:10px}
.step{min-width:110px;text-align:center;padding:10px 7px;border-radius:12px;background:#dce7e9;color:#718086;font-size:12px;font-weight:bold}
.step.active{background:var(--teal);color:white}
.step.done{background:#dff1e6;color:var(--green)}
.card{background:white;border-radius:18px;padding:28px;margin-top:18px;box-shadow:0 5px 20px #123f4912}
.badge{display:inline-block;background:var(--aqua);color:var(--teal);font-weight:bold;padding:7px 12px;border-radius:20px;margin-bottom:12px}
.instructions{background:#f2f8f9;border-left:5px solid var(--teal);padding:16px;border-radius:8px;margin:15px 0}
label.option{display:block;padding:12px;margin:8px 0;background:#f7fafb;border:1px solid #d7e4e7;border-radius:10px;cursor:pointer}
button{border:0;border-radius:10px;padding:13px 20px;font-weight:bold;cursor:pointer;background:var(--teal);color:white;margin:6px 4px 0 0}
button.secondary{background:#e8eff0;color:var(--deep)}
button:disabled{opacity:.45;cursor:not-allowed}
.result{padding:15px;border-radius:10px;margin-top:15px;font-weight:bold;display:none}
.good{background:#e2f4e8;color:var(--green);display:block}
.try{background:#fff0ed;color:var(--red);display:block}

.chartWrap{overflow-x:auto;margin:18px 0}
.charChart{width:100%;min-width:900px;border-collapse:separate;border-spacing:0;border:1px solid #c8d9dc;border-radius:12px;overflow:hidden;background:white}
.charChart th,.charChart td{border-right:1px solid #d7e4e7;border-bottom:1px solid #d7e4e7;padding:10px;vertical-align:top}
.charChart thead th{background:#0f6f78;color:white;font-size:13px}
.charChart tbody th{background:#e8f6f7;color:#123f49;width:125px;font-size:13px}
.charChart tr:last-child th,.charChart tr:last-child td{border-bottom:0}
.charChart th:last-child,.charChart td:last-child{border-right:0}
.charChart textarea{min-height:125px;font-size:13px;margin:0}

textarea{width:100%;min-height:110px;border:1px solid #c8d9dc;border-radius:10px;padding:12px;font-size:15px;margin-top:7px}
.checkrow{margin:10px 0}
.hidden{display:none}
.small{font-size:13px;color:var(--gray)}
.submissionCard{background:#eaf7f8;border:2px solid #79b9be;border-radius:14px;padding:18px;margin:18px 0}
.submissionCard h3{color:#0f6f78;margin:0 0 10px}
.submissionCard li{margin:8px 0}
.notesCard{background:#f7fbfc;border:1px solid #c8d9dc;border-radius:14px;padding:18px;margin:14px 0}
.notesCard h3{color:var(--teal);margin:0 0 7px}
.final{text-align:center}
</style>
</head>

    <ol>
      <li><strong>Survival Under Pressure</strong> — intense moment + direct quote + explanation.</li>
      <li><strong>Fear vs. Control</strong> — one example of each + which is stronger and why.</li>
      <li><strong>Belief or Instinct?</strong> — faith, intelligence, instinct, or training + quote + reasoning.</li>
      <li><strong>Character Development</strong> — how Pi changes and what earlier Pi would not have done.</li>
      <li><strong>Big Insight</strong> — strong claim about survival + real-life connection.</li>
    </ol>
    <label class="option"><input type="checkbox" class="req"> All five slides are complete.</label>
    <label class="option"><input type="checkbox" class="req"> Direct evidence is included and explained.</label>
    <label class="option"><input type="checkbox" class="req"> Everyone contributed.</label>
    <label class="option"><input type="checkbox" class="req"> One group member will submit the shared PowerPoint.</label>
    </div>
    <p><strong>📸 Evidence:</strong> Save a screenshot of the completed presentation or submission screen.</p>`,
    kind:"check"
  },
  {
    title:"Selection Assessment", icon:"📝",
    body:`<p>Complete the assigned <strong>Life of Pi Selection Test</strong> in Savvas.</p>
    <div class="instructions">
    <label class="option"><input type="checkbox" class="req"> Our group completed the assigned selection assessment.</label>
    <label class="option"><input type="checkbox" class="req"> We followed the teacher's directions for submitting it.</label>
    </div>
    <p class="small">This checkpoint does not reproduce the Savvas test questions. Complete the assigned assessment in Savvas.</p>
    <p><strong>📸 Evidence:</strong> Take a screenshot of your completion/submission screen if permitted.</p>`,
    kind:"check"
  },
  {
    title:"Final Check-In", icon:"🏁",
    body:`<p>Complete the <strong>Schoology Exit Ticket</strong> before you finish.</p>
    <div class="instructions">
    <p><strong>First, verify your Schoology submissions:</strong></p>
    <label class="option"><input type="checkbox" class="finalreq"> I submitted my required annotations/reading work in Schoology.</label>
    <label class="option"><input type="checkbox" class="finalreq"> I submitted the required screenshots/evidence for today's activities in Schoology.</label>
    <label class="option"><input type="checkbox" class="finalreq"> I submitted my individual Character Analysis Chart in Schoology.</label>
    <label class="option"><input type="checkbox" class="finalreq"> My group submitted the required PowerPoint.</label>

    <p><strong>Schoology Exit Ticket</strong></p>
    <p><strong>1. List your group members.</strong><textarea class="textreq"></textarea></p>
    <p><strong>2. On a scale of 1–5, what score would you give your group today?</strong></p>
    <select id="score" style="padding:10px;border-radius:8px;border:1px solid #c8d9dc">
      <option value="">Choose a score</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
    <p><strong>3. Explain in AT LEAST TWO SENTENCES why you gave your group the score you did. Discuss what went well and what needs to be improved.</strong><textarea class="textreq"></textarea></p>
    </div>`,
    kind:"final"
  }
];

let current = Number(localStorage.getItem("lpi_current") || 0);
let completed = JSON.parse(localStorage.getItem("lpi_completed") || "[]");

function renderProgress(){
  const p=document.getElementById("progress");
  p.innerHTML=activities.map((a,i)=>{
    const isDone=completed.includes(i);
    const isCurrent=i===current;
    const clickable=isDone || isCurrent;
    return `<div class="step ${isDone?'done':''} ${isCurrent?'active':''}" 
      ${clickable?`onclick="jumpToActivity(${i})"`:''}
      style="${clickable?'cursor:pointer;':''}"
      title="${clickable?'Click to open this completed/current activity':'Complete the previous activity to unlock this section'}">
      ${isDone?'✓':i<current?'✓':'🔒'} ${i+1}<br>${a.title}
    </div>`;
  }).join("");
}

function jumpToActivity(index){
  if(completed.includes(index) || index===current){
    current=index;
    localStorage.setItem("lpi_current",current);
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  }
}

function render(){
  renderProgress();
  const a=activities[current];
  document.getElementById("activity").innerHTML=`
    <div class="badge">ACTIVITY ${current+1} OF ${activities.length}</div>
    <h2>${a.icon} ${a.title}</h2>
    ${a.body}
    <div id="nextArea"></div>`;
  if(a.kind==="vocab"){
    addNavigationButtons();
    return;
  }
  const btn=document.createElement("button");
  btn.textContent=current===activities.length-1?"Finish Experience →":"Complete Activity & Continue →";
  btn.onclick=completeCurrent;
  document.getElementById("nextArea").appendChild(btn);
  addNavigationButtons();
}

function addNavigationButtons(){
  const area=document.getElementById("nextArea");
  const nav=document.createElement("div");
  nav.style.marginTop="12px";

  if(current>0){
    const back=document.createElement("button");
    back.className="secondary";
    back.textContent="← Go Back";
    back.onclick=()=>{
      current--;
      localStorage.setItem("lpi_current",current);
      render();
    };
    nav.appendChild(back);
  }

  if(current<activities.length-1 && completed.includes(current)){
    const next=document.createElement("button");
    next.className="secondary";
    next.textContent="Review Next →";
    next.onclick=()=>{
      current++;
      localStorage.setItem("lpi_current",current);
      render();
    };
    nav.appendChild(next);
  }
  area.appendChild(nav);
}

function completeCurrent(){
  const a=activities[current];
  if(a.kind==="check" || a.kind==="mixed"){
    if([...document.querySelectorAll(".req")].some(x=>!x.checked)){
      alert("Complete all checklist items before moving on.");
      return;
    }
  }
  if(a.kind==="text" || a.kind==="mixed" || a.kind==="final"){
    if([...document.querySelectorAll(".textreq")].some(x=>!x.value.trim())){
      alert("Complete all required response boxes before moving on.");
      return;
    }
  }
  if(a.kind==="final"){
    if([...document.querySelectorAll(".finalreq")].some(x=>!x.checked)){
      alert("Check every item in the completion checklist before finishing.");
      return;
    }
    if(!document.getElementById("score").value){
      alert("Choose your group score before finishing.");
      return;
    }
  }
  if(!completed.includes(current)) completed.push(current);
  localStorage.setItem("lpi_completed",JSON.stringify(completed));

  if(current===activities.length-1){
    renderFinished();
    return;
  }

  current++;
  localStorage.setItem("lpi_current",current);
  render();
}
function renderFinished(){
  renderProgress();
  document.getElementById("activity").innerHTML=`
    <div class="final">
      <div class="badge">🎉 EXPERIENCE COMPLETE</div>
      <h2>🏁 You Survived!</h2>
      <p><strong>All Peer Group Learning Activities are complete, including the Quick Write, Character Analysis Notes, Character Analysis Chart, and Theme Explanation.</strong></p>
      <div class="instructions">
        <p>Make sure your group has submitted the required work in Schoology.</p>
        <p>Keep your screenshots/completion evidence until your teacher confirms everything is received.</p>
      </div>
      <button onclick="current=0; localStorage.setItem('lpi_current',0); render();">↩ Review Activities</button>
    </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function checkVocab(){
  const ans=[document.querySelector('input[name="v1"]:checked')?.value,document.querySelector('input[name="v2"]:checked')?.value,document.querySelector('input[name="v3"]:checked')?.value];
  const r=document.getElementById("vocabResult");
  if(ans.every(Boolean) && ans[0]==="B" && ans[1]==="C" && ans[2]==="A"){
    r.className="result good"; r.textContent="🎉 3/3 — Excellent! Activity 3 is unlocked.";
    if(!completed.includes(current)) completed.push(current);
    localStorage.setItem("lpi_completed",JSON.stringify(completed));
    setTimeout(()=>{current++;localStorage.setItem("lpi_current",current);render();},700);
  } else {
    r.className="result try"; r.textContent="🔄 Not quite. Review the vocabulary and try again.";
  }
}
render();
</script>
</body>
</html>
